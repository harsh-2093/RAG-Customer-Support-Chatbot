<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">RAG Customer Support Chatbot: Architecture</text>

  <!-- INGESTION -->
  <text x="45" y="62" font-size="14" font-weight="bold" fill="#1d4ed8">1. INGESTION (runs on startup)</text>

  <rect x="45" y="80" width="150" height="64" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">PDF policies</text>
  <text x="120" y="127" text-anchor="middle" font-size="11" fill="#4b5563">knowledge/*.pdf</text>

  <rect x="235" y="80" width="150" height="64" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="310" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Read pages</text>
  <text x="310" y="127" text-anchor="middle" font-size="10" fill="#4b5563">PagePdfDocumentReader</text>

  <rect x="425" y="80" width="150" height="64" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Chunking</text>
  <text x="500" y="127" text-anchor="middle" font-size="10" fill="#4b5563">TokenTextSplitter (~300 tokens)</text>

  <rect x="615" y="80" width="150" height="64" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="690" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Embedding</text>
  <text x="690" y="127" text-anchor="middle" font-size="10" fill="#4b5563">all-MiniLM-L6-v2 (local, 384-d)</text>

  <line x1="195" y1="112" x2="233" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="112" x2="423" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="112" x2="613" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="112" x2="803" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PINECONE (spans both rows) -->
  <rect x="805" y="80" width="150" height="284" rx="8" fill="#fff1e0" stroke="#f59e0b" stroke-width="2"/>
  <text x="880" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Pinecone</text>
  <text x="880" y="232" text-anchor="middle" font-size="12" fill="#1f2937">vector database</text>
  <text x="880" y="256" text-anchor="middle" font-size="10" fill="#4b5563">chunk text + 384-d</text>
  <text x="880" y="270" text-anchor="middle" font-size="10" fill="#4b5563">vectors (cosine)</text>

  <line x1="45" y1="205" x2="760" y2="205" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- QUERY -->
  <text x="45" y="245" font-size="14" font-weight="bold" fill="#15803d">2. QUERY (every question)</text>

  <rect x="45" y="270" width="150" height="64" rx="8" fill="#e8f7ee" stroke="#22a45d" stroke-width="2"/>
  <text x="120" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Chat UI</text>
  <text x="120" y="317" text-anchor="middle" font-size="11" fill="#4b5563">HTML / CSS / JavaScript</text>

  <rect x="235" y="270" width="150" height="64" rx="8" fill="#e8f7ee" stroke="#22a45d" stroke-width="2"/>
  <text x="310" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Spring Boot API</text>
  <text x="310" y="317" text-anchor="middle" font-size="11" fill="#4b5563">/api/v1/query</text>

  <rect x="425" y="270" width="150" height="64" rx="8" fill="#e8f7ee" stroke="#22a45d" stroke-width="2"/>
  <text x="500" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Embed question</text>
  <text x="500" y="317" text-anchor="middle" font-size="10" fill="#4b5563">same MiniLM model</text>

  <line x1="195" y1="302" x2="233" y2="302" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="302" x2="423" y2="302" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="302" x2="803" y2="302" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="292" text-anchor="middle" font-size="11" fill="#374151">top-4 similarity search</text>

  <!-- Pinecone down to prompt builder -->
  <line x1="880" y1="364" x2="880" y2="428" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="402" font-size="11" fill="#374151">4 chunks</text>

  <!-- GENERATION -->
  <rect x="805" y="430" width="150" height="64" rx="8" fill="#f1eafd" stroke="#8b5cf6" stroke-width="2"/>
  <text x="880" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Prompt builder</text>
  <text x="880" y="477" text-anchor="middle" font-size="10" fill="#4b5563">system + chunks + history</text>

  <rect x="615" y="430" width="150" height="64" rx="8" fill="#f1eafd" stroke="#8b5cf6" stroke-width="2"/>
  <text x="690" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Gemini LLM</text>
  <text x="690" y="477" text-anchor="middle" font-size="10" fill="#4b5563">answers only from context</text>

  <rect x="425" y="430" width="150" height="64" rx="8" fill="#e8f7ee" stroke="#22a45d" stroke-width="2"/>
  <text x="500" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Answer</text>
  <text x="500" y="477" text-anchor="middle" font-size="10" fill="#4b5563">saved to chat history</text>

  <line x1="805" y1="462" x2="767" y2="462" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="462" x2="577" y2="462" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M425 462 H120 V336" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#374151">response to user</text>

  <!-- HISTORY -->
  <rect x="805" y="540" width="150" height="54" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="880" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Chat history</text>
  <text x="880" y="581" text-anchor="middle" font-size="10" fill="#4b5563">recent messages</text>
  <line x1="880" y1="540" x2="880" y2="496" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LEGEND -->
  <rect x="45" y="548" width="14" height="14" rx="3" fill="#e8f1fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="66" y="560" font-size="11" fill="#374151">Ingestion</text>
  <rect x="140" y="548" width="14" height="14" rx="3" fill="#e8f7ee" stroke="#22a45d" stroke-width="2"/>
  <text x="161" y="560" font-size="11" fill="#374151">Query flow</text>
  <rect x="240" y="548" width="14" height="14" rx="3" fill="#f1eafd" stroke="#8b5cf6" stroke-width="2"/>
  <text x="261" y="560" font-size="11" fill="#374151">Generation</text>
  <rect x="345" y="548" width="14" height="14" rx="3" fill="#fff1e0" stroke="#f59e0b" stroke-width="2"/>
  <text x="366" y="560" font-size="11" fill="#374151">Storage</text>
</svg>
