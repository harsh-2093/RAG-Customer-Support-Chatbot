spring.application.name=RagBasedLLM

#llm
spring.ai.google.genai.api-key=//api
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

#embedding model
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json

#vectordb
spring.ai.vectorstore.pinecone.api-key=//api
spring.ai.vectorstore.pinecone.index-name=shop-support
spring.ai.vectorstore.pinecone.namespace=policies

#spring retry
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30000ms
spring.ai.retry.on-http-codes=429,500,502,503,504